[project]
name = "webresearch"
version = "0.3.0"
description = "LLM-native browser: HTTP + QuickJS mini-DOM. Not Chromium."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "selectolax>=0.3.27",
    "quickjs>=1.19.0",
]

[project.scripts]
webresearch = "webresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webresearch"]

[tool.hatch.build.targets.wheel.force-include]
"webresearch/engine/minidom.js" = "webresearch/engine/minidom.js"
