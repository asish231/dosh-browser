[project]
name = "webresearch"
version = "0.3.0"
description = "LLM-native browser: HTTP + QuickJS mini-DOM. Not Chromium."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "httpx>=0.28.0,<1.0",
    "selectolax>=1.0.0,<2.0",
    "quickjs>=1.19.0,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
impersonate = ["curl_cffi>=0.7.0"]
http2 = ["h2>=4.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
webresearch = "webresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webresearch"]

[tool.hatch.build.targets.wheel.force-include]
"webresearch/engine/minidom.js" = "webresearch/engine/minidom.js"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001", "S110", "S112",
    "SIM103", "SIM117", "ISC004", "PYI034",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
