name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: dosh
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: dosh
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: dosh
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: dosh.exe
            archive: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin dosh --target ${{ matrix.target }}

      - name: Package Release Asset
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ matrix.binary }}"
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "$BIN_PATH" "dist/${{ matrix.binary }}"
            cd dist
            7z a -tzip "../dosh-${{ matrix.target }}.zip" "${{ matrix.binary }}"
            cd ..
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "dosh-${{ matrix.target }}.zip" > "dosh-${{ matrix.target }}.zip.sha256"
            else
              sha256sum "dosh-${{ matrix.target }}.zip" > "dosh-${{ matrix.target }}.zip.sha256"
            fi
          else
            cp "$BIN_PATH" "dist/dosh"
            cd dist
            tar -czf "../dosh-${{ matrix.target }}.tar.gz" dosh
            cd ..
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "dosh-${{ matrix.target }}.tar.gz" > "dosh-${{ matrix.target }}.tar.gz.sha256"
            else
              sha256sum "dosh-${{ matrix.target }}.tar.gz" > "dosh-${{ matrix.target }}.tar.gz.sha256"
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosh-${{ matrix.target }}
          path: |
            dosh-${{ matrix.target }}.tar.gz
            dosh-${{ matrix.target }}.tar.gz.sha256
            dosh-${{ matrix.target }}.zip
            dosh-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums Manifest
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
