[package]
name = "dosh-browser-core"
version = "1.0.0"
edition = "2021"
description = "Pure-Rust dosh-browser product — consumes doshgentv8-core"

[dependencies]
# The engine: pure Rust, zero Python, proven and tested.
doshgentv8-core = { path = "../doshgentv8/core" }

# HTTP & transport (replaces curl_cffi / httpx)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream", "json", "http2", "brotli", "gzip"] }
http = "1.2"
url = "2.5"
encoding_rs = "0.8"

# Parsing (replaces selectolax.lexbor)
kuchiki = "0.8"
html5ever = "0.27"

# Storage (replaces SQLite for profile, keeps compatibility)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto (replaces hashlib for host_crypto_digest, Ed25519/HMAC for web_bot_auth)
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ring = "0.17"

# Async runtime for fetch & server
tokio = { version = "1", features = ["rt", "macros", "fs", "time", "process", "rt-multi-thread", "sync", "net", "io-util"] }
futures = "0.3"
futures-util = "0.3"

# Body decoding (net.decode): gzip/deflate inflate + protobuf structural parse
flate2 = "1"
brotli = "7"

# WebSocket transport (net.ws): RFC 6455 client (ws + wss via rustls), with
# frames/session events recorded into the network ledger.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
regex = "1.10"

# Temp files (downloads, video)
tempfile = "3"

# Shell & Server
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = "0.6"
http-body-util = "0.1"
image = { version = "0.25.10", features = ["jpeg", "png"] }

[dev-dependencies]
futures-util = "0.3"
